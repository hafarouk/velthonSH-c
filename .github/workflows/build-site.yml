name: Build the website from the app code

# Builds the Student Hub website here (public repo, free build minutes) from the private
# hafarouk/Velthon-Student-Hub code, then publishes it with pages.yml.
# Needs the secret SOURCE_TOKEN: a fine-grained token with Contents: read-only on
# hafarouk/Velthon-Student-Hub. The app code itself is never copied into this repo.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  actions: write

concurrency: build-site

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
    steps:
      - name: Check for the token
        id: gate
        run: |
          if [ -n "$SOURCE_TOKEN" ]; then echo "ready=1" >> "$GITHUB_OUTPUT"; else echo "::notice::SOURCE_TOKEN not set — skipping."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == '1'
        with:
          path: public
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == '1'
        with:
          repository: hafarouk/Velthon-Student-Hub
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - name: Anything new since the last build?
        id: new
        if: steps.gate.outputs.ready == '1'
        run: |
          sha=$(git -C src rev-parse HEAD)
          last=$(cat public/.source-sha 2>/dev/null || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$last" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "build=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Website already matches the app code."; fi
      - uses: actions/setup-node@v4
        if: steps.new.outputs.build == '1'
        with:
          node-version: '22'
      - name: Build the website
        if: steps.new.outputs.build == '1'
        working-directory: src/tablet-app
        env:
          EXPO_PUBLIC_WEBSITE: '1'
        run: |
          v=$((123 + ${{ github.run_number }}))
          export EXPO_PUBLIC_APP_VERSION="1.1.$v"
          echo "VERSION=1.1.$v" >> "$GITHUB_ENV"
          npm install --no-audit --no-fund
          npx expo export --platform web --output-dir dist-web --clear
          node scripts/relative-web.mjs dist-web
      - name: Copy into the site and publish
        if: steps.new.outputs.build == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md ! -name download -exec rm -rf {} +
          cp -r ../src/tablet-app/dist-web/. .
          rm -f ./_headers ./metadata.json
          mv _expo expo && sed -i 's#\./_expo/#./expo/#g' index.html 404.html && touch .nojekyll
          echo "${{ steps.new.outputs.sha }}" > .source-sha
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name=velthon-sync -c user.email=sync@users.noreply.github.com commit -qm "Website v${VERSION}"
          git push
          gh workflow run pages.yml -R ${{ github.repository }}
